name: Bug report
description: Something doesn't work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please **don't** report security issues here — see [SECURITY.md](../../SECURITY.md).
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Create a brief…
        2. Open the client link on…
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Briefly version or commit
  - type: dropdown
    id: install
    attributes:
      label: How do you run Briefly?
      options: [Docker Compose, From source (pnpm dev), Other]
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or screenshots
      render: shell
