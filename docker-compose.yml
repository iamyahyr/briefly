# Briefly — self-hosted stack.
#
#   cp .env.example .env   # then set BETTER_AUTH_SECRET and APP_URL
#   docker compose up -d
#
# For local development you only need the database:
#   docker compose up -d db

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: briefly
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-briefly}
      POSTGRES_DB: briefly
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U briefly -d briefly"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    image: ghcr.io/iamyahyr/briefly:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgres://briefly:${POSTGRES_PASSWORD:-briefly}@db:5432/briefly
      STORAGE_LOCAL_PATH: /data/uploads
    ports:
      - "${APP_PORT:-3000}:3000"
    volumes:
      - uploads:/data/uploads

  # Optional S3-compatible storage: docker compose --profile s3 up -d
  minio:
    image: minio/minio:latest
    profiles: ["s3"]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-briefly}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:-briefly-secret}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

volumes:
  db-data:
  uploads:
  minio-data:
